name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r frontend/requirements.txt

      - name: Code Quality & Lint Checks
        run: |
          ruff check backend/
          PYTHONPATH=backend mypy --explicit-package-bases backend/app/core/

      - name: Security Static Audits
        continue-on-error: true
        run: |
          bandit -r backend/app/ -s B101,B105,B106 -ll
          pip-audit --desc || true

      - name: Run Pytest Suite with Coverage
        run: |
          PYTHONPATH=backend pytest backend/app/tests/ -v --cov=backend/app --cov-report=term-missing

      - name: Run System Evaluation Benchmark
        run: |
          PYTHONPATH=backend python evaluation/evaluate.py
